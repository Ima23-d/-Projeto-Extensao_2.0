<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataInsight • Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  </head>

  <body>
    <header class="barra-topo" role="banner">
         <div class="sidebar__header">
                <a class="marca" href="{{ url_for('pagina_landing') }}" aria-label="DataInsight - Início">
                    <span class="marca__simbolo" aria-hidden="true">
                        <i class="fa-solid fa-chart-column"></i>
                    </span>
                    DataInsight
                </a>
            </div>
    </header>

    <main id="conteudo" class="autenticacao" role="main">
      <section class="cartao autenticacao__cartao" aria-labelledby="titulo-login">
        <h1 id="titulo-login" class="autenticacao__titulo">Entrar</h1>
        <p class="autenticacao__subtitulo">Analise seus dados de forma simples e acessível.</p>

        <form action="{{ url_for('pg_login') }}" method="POST" style="margin-top: 24px; display: grid; gap: 16px;">
          {% if error %}
            <div style="background-color: #fee; color: #c00; padding: 12px; border-radius: 4px; margin-bottom: 16px;">{{ msg or 'Email ou senha incorretos' }}</div>
          {% endif %}

          <div class="campo">
            <label class="obrigatorio" for="email">Email</label>
            <input placeholder="Ex: xxxx@gmail.com" class="entrada" id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="campo">
            <label class="obrigatorio" for="senha">Senha</label>
            <input placeholder="Ex: Xxx20xx@" class="entrada" id="senha" name="senha" type="password" autocomplete="current-password" required />
          </div>

          <div style="display:flex; align-items:center; justify-content:space-between; gap: 12px; flex-wrap: wrap;">
            <label style="display:flex; align-items:center; gap:10px; color: var(--muted); font-weight:600;"><input type="checkbox" name="lembrar" class="checkbox" />Lembrar de mim</label>
          </div>

          <button class="botao botao--primario" type="submit">Entrar</button>

          <div class="autenticacao__links">
            <a href="{{ url_for('esqueceu_senha_route') }}" aria-label="Recuperar senha (placeholder)">Esqueceu a senha?</a>
            <a href="{{ url_for('pg_cadastro') }}">Criar conta</a>
          </div>
        </form>
      </section>
    </main>

    <!-- Painel Acessibilidae -->
    {% include 'partials/painel_acessibilidade.html' %}

    <!-- VLibras -->
    <div vw class="enabled" id="Vlibras">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>

    <script>
      new window.VLibras.Widget('https://vlibras.gov.br/app')
    </script>
    <script src="{{ url_for('static', filename='acessibilidade/acessibilidade.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
